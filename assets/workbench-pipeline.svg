<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="t d">
  <title id="t">Workbench build pipeline</title>
  <desc id="d">ExamGrid: milestones 1 to 7 done (solver core, optimisation, rooms and seating, backend, imports, async runs, publishing); milestone 8, the React console, in progress; 9 and 10 queued. Medfold: OCR pipeline, LLM extraction, search and trends, and v1.1.0 shipped; two-factor login, doctor share links and FHIR export queued.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .lab  { font-size: 10.5px; fill: #cfc8e6; text-anchor: middle; }
    .labq { font-size: 10.5px; fill: #6f6890; text-anchor: middle; }
    .proj { font-size: 15px; font-weight: 800; fill: #ffffff; }
    .meta { font-size: 12px; fill: #8b84a8; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17142a"/><stop offset="1" stop-color="#100e1c"/></linearGradient>
    <g id="done"><circle r="13" fill="#7ee8c7"/><path d="M-6 0 l4 4 l8 -8" fill="none" stroke="#14121f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="todo"><circle r="12" fill="#14121f" stroke="#3a3458" stroke-width="2" stroke-dasharray="3 3"/></g>
  </defs>

  <rect x="1" y="1" width="838" height="338" rx="16" fill="url(#bg)" stroke="#2a2540" stroke-width="2"/>
  <path d="M1 17 a16 16 0 0 1 16 -16 h806 a16 16 0 0 1 16 16 v31 h-838 z" fill="#1e1a33"/>
  <g class="sans">
    <circle cx="30" cy="25" r="6" fill="#ffd479"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="46" y="30" fill="#f4f0ff" font-size="14" font-weight="700">workbench</text>
    <text x="128" y="30" class="mono" fill="#8b84a8" font-size="12.5">build #2028 · in progress · graduating with it</text>
    <text x="810" y="30" text-anchor="end" class="mono" fill="#6f6890" font-size="12">● done  ◌ queued</text>

    <!-- ExamGrid -->
    <text x="30" y="84" class="proj">ExamGrid</text>
    <text x="112" y="84" class="meta">7 / 10 milestones</text>
    <line x1="60" y1="120" x2="780" y2="120" stroke="#3a3458" stroke-width="2"/>
    <line x1="60" y1="120" x2="620" y2="120" stroke="#7ee8c7" stroke-width="2"/>
    <use href="#done" x="60" y="120"/><use href="#done" x="140" y="120"/><use href="#done" x="220" y="120"/><use href="#done" x="300" y="120"/>
    <use href="#done" x="380" y="120"/><use href="#done" x="460" y="120"/><use href="#done" x="540" y="120"/>
    <g transform="translate(620 120)">
      <circle r="13" fill="#14121f" stroke="#3a3458" stroke-width="2"/>
      <path d="M0 -13 A13 13 0 0 1 13 0" fill="none" stroke="#ffd479" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#ffd479"/>
    </g>
    <use href="#todo" x="700" y="120"/><use href="#todo" x="780" y="120"/>

    <text x="60" y="152" class="lab">solver</text><text x="60" y="166" class="lab">core</text>
    <text x="140" y="152" class="lab">annealing</text><text x="140" y="166" class="lab">+ tabu</text>
    <text x="220" y="152" class="lab">rooms +</text><text x="220" y="166" class="lab">seating</text>
    <text x="300" y="152" class="lab">spring</text><text x="300" y="166" class="lab">backend</text>
    <text x="380" y="152" class="lab">csv/xlsx</text><text x="380" y="166" class="lab">imports</text>
    <text x="460" y="152" class="lab">async runs</text><text x="460" y="166" class="lab">+ SSE</text>
    <text x="540" y="152" class="lab">publish +</text><text x="540" y="166" class="lab">redis</text>
    <text x="620" y="152" class="lab" fill="#ffd479" font-weight="700" style="fill:#ffd479">react</text><text x="620" y="166" class="lab" style="fill:#ffd479">console</text>
    <text x="700" y="152" class="labq">live run</text><text x="700" y="166" class="labq">views</text>
    <text x="780" y="152" class="labq">ci/cd +</text><text x="780" y="166" class="labq">load tests</text>

    <!-- Medfold -->
    <text x="30" y="226" class="proj">Medfold</text>
    <text x="104" y="226" class="meta">v1.1.0 shipped · next up</text>
    <line x1="60" y1="262" x2="540" y2="262" stroke="#3a3458" stroke-width="2"/>
    <line x1="60" y1="262" x2="300" y2="262" stroke="#7ee8c7" stroke-width="2"/>
    <use href="#done" x="60" y="262"/><use href="#done" x="140" y="262"/><use href="#done" x="220" y="262"/>
    <g transform="translate(300 262)"><circle r="15" fill="#ff8fab"/><text y="4" text-anchor="middle" class="mono" fill="#14121f" font-size="10" font-weight="800">1.1</text></g>
    <use href="#todo" x="380" y="262"/><use href="#todo" x="460" y="262"/><use href="#todo" x="540" y="262"/>

    <text x="60" y="296" class="lab">OCR</text><text x="60" y="310" class="lab">pipeline</text>
    <text x="140" y="296" class="lab">LLM</text><text x="140" y="310" class="lab">extraction</text>
    <text x="220" y="296" class="lab">search +</text><text x="220" y="310" class="lab">trends</text>
    <text x="300" y="296" class="lab" style="fill:#ff8fab" font-weight="700">v1.1.0</text><text x="300" y="310" class="lab" style="fill:#ff8fab">shipped</text>
    <text x="380" y="296" class="labq">two-factor</text><text x="380" y="310" class="labq">login</text>
    <text x="460" y="296" class="labq">doctor</text><text x="460" y="310" class="labq">share links</text>
    <text x="540" y="296" class="labq">FHIR</text><text x="540" y="310" class="labq">export</text>

    <text x="810" y="296" text-anchor="end" class="mono" fill="#6f6890" font-size="11">roadmaps live in each repo</text>
  </g>
</svg>
