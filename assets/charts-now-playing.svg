<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-labelledby="t d">
  <title id="t">Now playing: What Makes a Global Top 50 Hit Last?</title>
  <desc id="d">Analytics project on 27,800 daily chart entries: 45 data-quality checks, 103 tests, a model with ROC-AUC 0.91 on unseen 2024 songs, and a live dashboard.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a24"/>
      <stop offset="0.55" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="0.5" stop-color="#a59cff"/>
      <stop offset="1" stop-color="#1ed760"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="228" rx="16" fill="url(#card)" stroke="#2a2a2a" stroke-width="2"/>

  <!-- album art -->
  <rect x="30" y="30" width="170" height="170" rx="10" fill="url(#art)"/>
  <g class="sans" fill="#ffffff">
    <text x="46" y="62" font-size="13" font-weight="800" letter-spacing="2" opacity="0.95">GLOBAL</text>
    <text x="44" y="112" font-size="54" font-weight="900" letter-spacing="-2">TOP</text>
    <text x="44" y="166" font-size="54" font-weight="900" letter-spacing="-2">50</text>
    <text x="46" y="188" font-size="11" font-weight="600" opacity="0.9">556 days · 797 songs</text>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <rect x="150" y="150" width="8" height="30" rx="2"/><rect x="162" y="140" width="8" height="40" rx="2"/><rect x="174" y="160" width="8" height="20" rx="2"/>
  </g>

  <g class="sans">
    <!-- equalizer + label -->
    <g fill="#1ed760">
      <rect x="230" y="40" width="4" height="12" rx="1"><animate attributeName="height" values="12;4;10;6;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="40;48;42;46;40" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="237" y="40" width="4" height="12" rx="1"><animate attributeName="height" values="5;12;7;11;5" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="47;40;45;41;47" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="244" y="40" width="4" height="12" rx="1"><animate attributeName="height" values="9;5;12;4;9" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="43;47;40;48;43" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <text x="256" y="51" fill="#1ed760" font-size="11" font-weight="700" letter-spacing="1.6">NOW PLAYING</text>

    <text x="230" y="88" fill="#ffffff" font-size="26" font-weight="800">What Makes a Global Top 50 Hit Last?</text>
    <text x="230" y="114" fill="#b3b3b3" font-size="14.5">Neha Karamchandani  ·  feat. DuckDB, scikit-learn &amp; Power BI</text>
    <text x="230" y="140" fill="#8f8f8f" font-size="13" class="mono">♪ 27,800 chart entries · 45 data-quality checks · 103 tests</text>

    <!-- progress -->
    <rect x="230" y="162" width="580" height="5" rx="2.5" fill="#3a3a3a"/>
    <rect x="230" y="162" width="0" height="5" rx="2.5" fill="#1ed760">
      <animate attributeName="width" from="0" to="527.8" begin="0.3s" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
    </rect>
    <circle cx="230" cy="164.5" r="7" fill="#ffffff">
      <animate attributeName="cx" from="230" to="757.8" begin="0.3s" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1" keyTimes="0;1"/>
    </circle>
    <text x="230" y="190" fill="#b3b3b3" font-size="12" class="mono">ROC-AUC</text>
    <text x="810" y="190" text-anchor="end" fill="#b3b3b3" font-size="12" class="mono"><tspan fill="#ffffff" font-weight="700">0.91</tspan> / 1.00</text>
    <text x="520" y="190" text-anchor="middle" fill="#6f6f6f" font-size="11.5">predicts a song's chart life from its first week</text>
  </g>
</svg>
